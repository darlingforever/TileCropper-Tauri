[package]
name = "tilecropper"
version = "2.0.0"
description = "Windows 10 开始菜单磁贴切图工具"
authors = ["希瓜果汁"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tilecropper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
md-5 = "0.10"
# Windows 专属依赖：只用 COM + Shell（快捷方式创建）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
